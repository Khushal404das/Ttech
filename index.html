      (function() {
        try {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');

    <script>
      (function() {
        // Prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;

          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || !desc.set) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch || (originalFetch ? originalFetch : window.fetch);
              },
              set: function(fn) {
                currentFetch = fn;
              }
            });
          }
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoDesc = Object.getOwnPropertyDescriptor(proto, 'fetch');
              if (!protoDesc || !protoDesc.set) {
                var pFetch = window.fetch;
                Object.defineProperty(proto, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return pFetch;
                  },
                  set: function(fn) {
                    pFetch = fn;
                  }
                });
              }
            }
          } catch (e2) {}
        }

        // Global capture-phase unhandled rejection handler (suppress WebSocket closed without opened in iframe preview)
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Global capture-phase error handler for fetch getter assignment & websocket errors
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string') {
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) ||
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('websocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);

        // Intercept Vite HMR WebSocket connections to prevent premature closed-without-opened rejections
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1))
            ) {
              var listeners = {};
              var mockSocket = {
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {
                  mockSocket.readyState = 3;
                },
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { listener({ type: 'open' }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return mockSocket;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = RealWebSocket.CONNECTING;
          window.WebSocket.OPEN = RealWebSocket.OPEN;
          window.WebSocket.CLOSING = RealWebSocket.CLOSING;
          window.WebSocket.CLOSED = RealWebSocket.CLOSED;
        }
      })();
    </script>
