<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FBFF"/>
  
  <!-- Gradient Background -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF2FF"/>
      <stop offset="100%" stop-color="#F8FBFF"/>
    </linearGradient>
  </defs>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="150" fill="#2563EB" opacity="0.05"/>
  <circle cx="1100" cy="530" r="200" fill="#60A5FA" opacity="0.05"/>
  
  <!-- Main Content Area -->
  <rect x="100" y="150" width="1000" height="330" rx="20" fill="white" opacity="0.8"/>
  
  <!-- Logo/Icon -->
  <circle cx="200" cy="315" r="60" fill="#2563EB"/>
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">T</text>
  
  <!-- Company Name -->
  <text x="320" y="300" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#0B1220">
    Ttech SOLUTIONS
  </text>
  
  <!-- Tagline -->
  <text x="320" y="350" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#2563EB">
    Think. Transform. Trust.
  </text>
  
  <!-- Description -->
  <text x="320" y="400" font-family="Arial, sans-serif" font-size="24" fill="#475569">
    Enterprise Software Development
  </text>
  <text x="320" y="435" font-family="Arial, sans-serif" font-size="24" fill="#475569">
    SaaS Platforms • Web Applications • UI/UX Design
  </text>
  
  <!-- Bottom Badge -->
  <rect x="100" y="520" width="280" height="50" rx="25" fill="#2563EB"/>
  <text x="240" y="552" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    🚀 Professional Development
  </text>
</svg>
